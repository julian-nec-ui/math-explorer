# Build and deploy a Next.js site to GitHub Pages (pnpm, static export)
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages serves only static files: the server routes (NextAuth API, middleware)
      # are removed from this build's copy of the code. Your repository is not changed.
      - name: Remove server-only routes (not supported on GitHub Pages)
        run: |
          rm -rf app/api src/app/api
          rm -f middleware.ts middleware.js src/middleware.ts src/middleware.js

      # Pages that read cookies, headers or the session on the server cannot be static:
      # they are left out of the GitHub Pages build (your repository is not changed).
      - name: Remove pages that need a server
        run: |
          for dir in app src/app; do
            [ -d "$dir" ] || continue
            grep -rlE "next/headers|getServerSession|cookies\(\)|headers\(\)" "$dir" \
              --include=page.tsx --include=page.ts --include=page.jsx --include=page.js \
              --include=layout.tsx --include=layout.ts \
              | while read -r f; do
                  route_dir=$(dirname "$f")
                  if [ "$route_dir" = "$dir" ]; then
                    echo "::warning::$f needs a server but it is the root page/layout; leaving it"
                  else
                    echo "Removing $route_dir (uses server-only APIs)"
                    rm -rf "$route_dir"
                  fi
                done
          done

      # Force the static export for this build only, whatever next.config says: the project's own
      # config is kept and wrapped, with output "export", the repo's base path and unoptimized images
      # added on top. Your repository is not changed.
      - name: Force static export
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: |
          cfg=""
          for f in next.config.ts next.config.mjs next.config.js; do
            [ -f "$f" ] && cfg="$f" && break
          done
          if [ -n "$cfg" ]; then
            ext="${cfg##*.}"
            mv "$cfg" "next.config.base.$ext"
            base="import base from './next.config.base';"
            [ "$ext" = "js" ] && base="const base = require('./next.config.base.js');"
          else
            ext="mjs"
            base="const base = {};"
          fi
          out="next.config.$ext"
          [ "$ext" = "js" ] && exp="module.exports =" || exp="export default"
          cat > "$out" <<CFG
          // @ts-nocheck
          $base
          const bp = process.env.BASE_PATH || "";
          $exp async (phase, ctx) => {
            const b = (base && base.default) || base;
            const c = typeof b === "function" ? await b(phase, ctx) : (b || {});
            return {
              ...c,
              output: "export",
              basePath: bp,
              trailingSlash: true,
              images: { ...(c.images || {}), unoptimized: true },
            };
          };
          CFG
          echo "---- $out (for this build only)"; cat "$out"

      - name: Build (static export)
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"

      - name: Check export
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::The build made no ./out/index.html"
            ls -la
            exit 1
          fi
          touch out/.nojekyll
          echo "---- assets referenced by out/index.html:"
          grep -oE '(href|src)="[^"]*_next/static[^"]*"' out/index.html | sort -u | head -20
          css=$(grep -oE 'href="[^"]*\.css"' out/index.html | head -1 | sed -E 's/href="//; s/"$//')
          [ -n "$css" ] || { echo "::error::out/index.html links no stylesheet"; exit 1; }
          f="out${css#${BASE_PATH}}"
          [ -f "$f" ] || { echo "::error::$css is linked but $f is not in the export"; exit 1; }
          echo "stylesheet ok: $css"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5